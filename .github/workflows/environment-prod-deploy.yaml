name: Environment prod - deploy

# On merge to main: the PR checks, then apply the prod plan approved on the
# merged PR, then build and upload the UI with prod's settings.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time, never cancelled part-way through an apply. A newer
# pending run replaces an older one.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: test
    uses: ./.github/workflows/pr-checks.yaml

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod-rw
    permissions:
      contents: read
      id-token: write
      # The apply action reads the merged PR's plan comment and updates it.
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # On push, applies only the plan posted on the merged PR, and fails if
      # prod would now change differently. A manual run (main only: prod-rw
      # allows protected branches only) plans and applies main as it is, to
      # recover from a failed or out-of-order deploy.
      - name: Terraform apply
        uses: dflook/terraform-apply@c2d5b9ce3fefcaefa4bbd484691457ad7842b4a3 # v3.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: terraform/environment/prod
          label: prod
          # Must match environment-prod-plan.yaml.
          backend_config: |
            bucket=${{ vars.STATE_BUCKET }}
            key=meal-planner/prod/terraform.tfstate
            region=${{ vars.AWS_REGION }}
          auto_approve: ${{ github.event_name == 'workflow_dispatch' }}

      # The pnpm version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # .terraform-version is the one place the Terraform version is set.
      - name: Read Terraform version
        id: terraform-version
        run: |
          read -r version < .terraform-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Make reads prod's outputs with `terraform output`. No wrapper, so Make
      # sees Terraform's own exit codes and output.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      # Make inits prod against the real backend (the apply action used its
      # own data directory, so there's no .terraform yet), writes
      # output.json, and builds with prod's Cognito settings. CI=true makes
      # Make use the credentials above rather than a profile.
      - name: Build the UI
        run: make build-ui ENV=prod STATE_BUCKET="$STATE_BUCKET"
        env:
          CI: true
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}

      - name: Upload the UI and invalidate CloudFront
        run: make push-ui ENV=prod STATE_BUCKET="$STATE_BUCKET"
        env:
          CI: true
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
