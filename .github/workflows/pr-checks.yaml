name: PR checks

# Also reusable: environment-prod-deploy.yaml calls it before applying. The
# prod plan runs in its own workflow alongside this one, so a PR runs these
# checks once and the required `test` check keeps its name.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Cancel a superseded run when a PR gets a new push. When called, the
# workflow and event are the caller's, so a deploy's checks are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-pr-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Branch protection requires this check by name; keep it stable.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # setup-go reads the `toolchain` line in backend/go.mod.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          # No backend/go.sum yet (no dependencies), so there is nothing to
          # key a cache on. Enable it with `cache-dependency-path:
          # backend/go.sum` once the first dependency lands.
          cache: false

      # .terraform-version is the one place the Terraform version is set.
      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(< .terraform-version)" >> "$GITHUB_OUTPUT"

      # No wrapper, so Make sees Terraform's own exit codes and output.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      # `make test` runs `pnpm install --frozen-lockfile` first. Its Terraform
      # tests mock their providers, so no AWS credentials are needed. Trivy
      # isn't installed here; security.yaml runs it.
      - name: Lint, typecheck, validate, unit, Go and Terraform tests
        run: make test

      - name: Get Playwright version
        id: playwright
        run: pnpm exec playwright --version | awk '{ print "version=" $2 }' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The browser is cached, but its OS packages are not.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E tests
        run: make test-e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
